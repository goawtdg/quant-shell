[project]
name = "quant-shell-reference"
version = "0.4.0"
description = "Optional reference strategy/picker for quant-shell (example only, not required)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "quant-shell>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reference_policy*"]
